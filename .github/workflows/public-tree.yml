name: Public tree check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Refuse private material in the public tree
        run: python3 ci/check_public_tree.py
