name: FLR random-SNI sing-box source validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flr-sing-box-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Export owned synthetic production configurations
        working-directory: runtime
        run: go run ./cmd/flr-compat ../out/engine-contracts internal/profile/testdata
      - name: Check artifact guards
        run: python3 -m unittest discover -s tests
      - name: Build both static targets from pinned source plus FLR patch, without Naive
        run: python3 ci/build-sing-box.py
      - name: Check version, capability and every production sing-box configuration with matching AMD64 engine
        run: python3 ci/check-sing-box.py
      - name: Upload source provenance and native validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flr-sing-box-source-${{ github.run_number }}
          path: |
            out/sing-box/
            out/engine-contracts/
            out/sing-box-native.json
          if-no-files-found: error
          retention-days: 14
